<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>afterglow · PS4 14.00/14.02</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#000;color:#ccc;font:15px/1.5 system-ui,sans-serif}
  #matrix{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.35}
  body.log #matrix,body.done #matrix,body.fail #matrix{opacity:.08}
  #landing{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;color:#0f0}
  body.log #landing,body.done #landing,body.fail #landing{display:none}
  #landing h1{font-size:3em;letter-spacing:3px;text-shadow:0 0 20px #0f0,0 0 40px #0f0}
  #landing .sub{margin:10px 0 30px;color:#7fd0a0;font-size:.95em;letter-spacing:1px}
  #startBtn{padding:20px 70px;font-size:1.5em;font-weight:800;letter-spacing:3px;background:#0f0;color:#000;border:none;border-radius:12px;cursor:pointer;box-shadow:0 0 25px #0f0;transition:all .15s}
  #startBtn:active{transform:scale(.96)}
  #startBtn:disabled{opacity:.4;cursor:wait;box-shadow:none}
  .subBtn{padding:12px 24px;font-size:.95em;font-weight:700;letter-spacing:1px;background:#11151b;color:#7fd0a0;border:1px solid #1e2732;border-radius:8px;cursor:pointer;transition:all .15s}
  .subBtn:hover{border-color:#0f0;color:#0f0;box-shadow:0 0 10px rgba(0,255,0,.2)}
  .subBtn:active{transform:scale(.96)}
  #btnGroup{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap;justify-content:center}
  #hint{margin-top:15px;color:#666;font-size:.9em}
  #logview{display:none;position:fixed;inset:0;z-index:2;flex-direction:column;background:#0a0c0f}
  body.log #logview,body.fail:not(.done) #logview{display:flex}
  #brand{padding:12px;text-align:center;background:#0e1116;border-bottom:1px solid #1e2732;color:#0f0;font-weight:800;letter-spacing:4px}
  #ramBox{padding:6px 12px;font:11px/1.4 monospace;color:#7fd0a0;background:#0b0d10;border-bottom:1px solid #1e2732;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #state,#out{display:none}
  #state{padding:10px 15px;font-size:20px;font-weight:700;color:#d8c07f}
  #out{flex:1;min-height:0;overflow-y:auto;padding:10px 15px;font:12px/1.4 monospace;white-space:pre-wrap;color:#c8ced8;background:#0a0c0f}
  body.log #state,body.log #out,body.fail:not(.done) #state,body.fail:not(.done) #out{display:block}
  #msg{display:none;position:fixed;inset:0;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:1.8em;font-weight:700;letter-spacing:1px;white-space:pre-wrap;line-height:1.4}
  body.done #msg{display:flex;color:#7fd0a0;background:radial-gradient(ellipse at center,rgba(0,20,10,.95),rgba(0,0,0,.98))}
  body.fail:not(.done) #msg{display:flex;color:#d08a7f;background:radial-gradient(ellipse at center,rgba(30,10,10,.95),rgba(0,0,0,.98))}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="landing">
  <h1>afterglow</h1>
  <p class="sub">PS4 KERNEL EXPLOIT · FW 14.00 / 14.02</p>
  <button id="startBtn" disabled>CARREGANDO...</button>
  <div id="btnGroup">
    <button id="ghBtn" class="subBtn">▶ GoldHEN (Direct Loader)</button>
    <button id="probeBtn" class="subBtn">🔍 Diagnóstico (Probe)</button>
  </div>
  <p id="hint"></p>
</div>
<div id="logview">
  <div id="brand">AFTERGLOW</div>
  <div id="ramBox">RAM: ...</div>
  <div id="state"></div>
  <div id="out"></div>
</div>
<div id="msg"></div>
<script type="module" src="script.js?v=1402s"></script>
</body>
</html>
